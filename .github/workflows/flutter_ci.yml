name: Flutter CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Farmer dependencies
        run: cd apps/farmer_app && flutter pub get
      - name: Farmer analyze
        run: cd apps/farmer_app && flutter analyze
      - name: Farmer test
        run: cd apps/farmer_app && flutter test
      - name: Decode keystore
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf %s "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/farmer_app/android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Resolve signing credentials
        run: |
          set -euo pipefail
          STORE_PASS='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}'
          KEY_PASS='${{ secrets.ANDROID_KEY_PASSWORD }}'
          KEYSTORE='apps/farmer_app/android/app/release.keystore'

          test -n "$STORE_PASS"

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" 2>/dev/null | awk -F': ' '/Alias name:/{print $2; exit}')
          fi
          test -n "$KEY_ALIAS"

          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$STORE_PASS"
          fi

          if ! keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" >/dev/null 2>&1; then
            if keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$STORE_PASS" >/dev/null 2>&1; then
              KEY_PASS="$STORE_PASS"
            else
              echo "Signing credentials validation failed. Check ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_KEYSTORE_PASSWORD secrets."
              exit 1
            fi
          fi

          cat > apps/farmer_app/android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          PROPS
      - name: Build release APK
        run: cd apps/farmer_app && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kisan-ledger-apk
          path: apps/farmer_app/build/app/outputs/flutter-apk/app-release.apk

name: Flutter CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Farmer dependencies
        run: cd apps/farmer_app && flutter pub get
      - name: Farmer analyze
        run: cd apps/farmer_app && flutter analyze
      - name: Farmer test
        run: cd apps/farmer_app && flutter test
      - name: Decode keystore
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf %s "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/farmer_app/android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          test -n "${{ secrets.ANDROID_KEY_PROPERTIES }}"
          printf %s "${{ secrets.ANDROID_KEY_PROPERTIES }}" > apps/farmer_app/android/key.properties
      - name: Build release APK
        run: cd apps/farmer_app && flutter build apk --release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: release.keystore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kisan-ledger-apk
          path: apps/farmer_app/build/app/outputs/flutter-apk/app-release.apk

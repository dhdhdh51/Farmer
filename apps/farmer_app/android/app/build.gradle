plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingValue = { String propertyKey, String envKey ->
    def fromProps = keystoreProperties.getProperty(propertyKey)
    if (fromProps != null && fromProps.trim()) return fromProps
    return System.getenv(envKey)
}

android {
    namespace "com.kisanledger.farmer"
    compileSdk 35
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.kisanledger.farmer"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            storeFile file(signingValue('storeFile', 'ANDROID_KEYSTORE_PATH') ?: 'release.keystore')
            storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
            keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
            keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}
